name: CI

on:
  push:
    branches: [main, windows-port]
  pull_request:

permissions:
  contents: read

jobs:
  linux-gcc:
    name: Linux (GCC 15, release build)
    runs-on: ubuntu-24.04
    # The image and toolset tools/build-release.sh ships with.
    container: almalinux:9@sha256:3a3fa7f043b142bc8008c8b308d39b47d2c84008addcd52f9f9a7a82d2a90474
    env:
      TOOLSET: gcc-toolset-15
    steps:
      - name: Install packages
        run: |
          dnf -y install dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf -y install git bzip2 unzip "$TOOLSET-gcc-c++" "$TOOLSET-libstdc++-devel" libstdc++-static \
            libX11-devel libXext-devel libXcursor-devel libXi-devel libXfixes-devel libXrandr-devel libXrender-devel \
            libxkbcommon-devel wayland-devel wayland-protocols-devel libdecor-devel \
            mesa-libEGL-devel mesa-libGL-devel dbus-devel

      - name: Install CMake and Ninja
        run: |
          curl --fail --silent --show-error --location --output /tmp/cmake.tar.gz \
            https://github.com/Kitware/CMake/releases/download/v4.3.2/cmake-4.3.2-linux-x86_64.tar.gz
          curl --fail --silent --show-error --location --output /tmp/ninja.zip \
            https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-linux.zip
          printf '%s\n' \
            "791ae3604841ca03cb3889a3ad89165346e4b180ae3448efd4b0caa9ef46d245  /tmp/cmake.tar.gz" \
            "5749cbc4e668273514150a80e387a957f933c6ed3f5f11e03fb30955e2bbead6  /tmp/ninja.zip" | sha256sum --check
          mkdir -p /opt/cmake /opt/ninja
          tar -xzf /tmp/cmake.tar.gz -C /opt/cmake --strip-components=1
          unzip -q /tmp/ninja.zip -d /opt/ninja
          echo /opt/cmake/bin >> "$GITHUB_PATH"
          echo /opt/ninja >> "$GITHUB_PATH"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch submodules and Mbed TLS
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -P scripts/init_submodules.cmake

      # tge-core's own suites run here too: it has no CI of its own.
      - name: Configure
        run: |
          source "/opt/rh/$TOOLSET/enable"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/linux/gcc.cmake \
            -DLKT_STATIC_RUNTIME=ON \
            -DLKT_AUTO_INIT_SUBMODULES=OFF \
            -DTGE_CORE_BUILD_TESTS=ON

      # Before Lookout's own build, so tge-core, which other projects share, is checked even when that build fails.
      - name: Build tge-core
        run: |
          source "/opt/rh/$TOOLSET/enable"
          cmake --build build --target TgeCoreUnitTests TgeCoreThreadingTests TgeCoreNetTests TgeCoreIOTests TgeCoreProcessTests

      - name: Test tge-core
        run: ctest --test-dir build --tests-regex '^TgeCore' --output-on-failure

      - name: Build
        run: |
          source "/opt/rh/$TOOLSET/enable"
          cmake --build build --target all

      - name: Test
        run: ctest --test-dir build --tests-regex '^LookoutTests$' --output-on-failure

  windows:
    name: Windows (${{ matrix.preset }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: windows-msvc-debug
            dir: msvc-Debug
            static: OFF
          - preset: windows-msvc-release
            dir: msvc-Release
            static: ON
          - preset: windows-clangcl-debug
            dir: clangcl-Debug
            static: OFF
          - preset: windows-clangcl-release
            dir: clangcl-Release
            static: ON
    # tge-core's suites are named: all leaves them out.
    env:
      TARGETS: all LookoutTests TgeCoreUnitTests TgeCoreThreadingTests TgeCoreNetTests TgeCoreIOTests TgeCoreProcessTests
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Install CMake
        run: |
          $archive = "$env:RUNNER_TEMP\cmake.zip"
          Invoke-WebRequest -UseBasicParsing -OutFile $archive `
            https://github.com/Kitware/CMake/releases/download/v4.3.2/cmake-4.3.2-windows-x86_64.zip
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '83d20c23f5c5f64b3b328785e35b23c532e33057a97ed6294acaca3781b78a01') { throw "cmake.zip: unexpected SHA-256 $hash" }
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
          "LKT_CMAKE=$env:RUNNER_TEMP\cmake-4.3.2-windows-x86_64\bin\cmake.exe" >> $env:GITHUB_ENV

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch submodules and Mbed TLS
        run: '& $env:LKT_CMAKE -P scripts/init_submodules.cmake'

      - name: Configure and build
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = "$vs\VC\Auxiliary\Build\vcvars64.bat"
          cmd /c "`"$vcvars`" && `"$env:LKT_CMAKE`" --preset ${{ matrix.preset }} -DLKT_STATIC_RUNTIME=${{ matrix.static }} -DTGE_CORE_BUILD_TESTS=ON && `"$env:LKT_CMAKE`" --build --preset ${{ matrix.preset }} --target $env:TARGETS"
          if ($LASTEXITCODE -ne 0) { throw "build failed ($LASTEXITCODE)" }

      - name: Test
        run: |
          & (Join-Path (Split-Path $env:LKT_CMAKE) ctest.exe) --test-dir build/${{ matrix.dir }} --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "tests failed ($LASTEXITCODE)" }

      # Windows tells a window program from a console one by the subsystem in its PE header: 2 and 3. The step ends
      # with exit 0, as pwsh would otherwise end it with the last program's code, which --nonsense makes 1.
      - name: Check Lookout's programs
        run: |
          function Get-Subsystem([string] $path)
          {
            $bytes = [IO.File]::ReadAllBytes($path)
            [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3C) + 0x5C)
          }

          $build = "build/${{ matrix.dir }}"
          if ((Get-Subsystem "$build/lookout.exe") -ne 2) { throw "lookout.exe is not a window program" }
          if ((Get-Subsystem "$build/lookout.com") -ne 3) { throw "lookout.com is not a console program" }

          $version = & "$build/lookout.com" --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^Lookout \d+\.\d+\.\d+$') { throw "lookout.com --version said '$version' ($LASTEXITCODE)" }

          & "$build/lookout.com" --check external/lookout-games
          if ($LASTEXITCODE -ne 0) { throw "lookout.com --check failed ($LASTEXITCODE)" }

          & "$build/lookout.com" --nonsense
          if ($LASTEXITCODE -ne 1) { throw "lookout.com --nonsense exited $LASTEXITCODE, not 1" }

          exit 0
